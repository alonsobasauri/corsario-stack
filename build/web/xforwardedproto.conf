# Traefik termina TLS y reenvia por HTTP interno. Sin esto $_SERVER['HTTPS']
# en PHP queda vacio SIEMPRE (aunque el visitante entro por https de verdad),
# y el codigo del sitio arma URLs absolutas ("http://..." en vez de
# "https://...") con eso. (El loop de redirect de .htaccess se arreglo
# aparte, en el propio .htaccess, porque mod_rewrite no respeta este truco
# para %{HTTPS} -- comprobado en vivo -- pero PHP si respeta este env var.)
SetEnvIf X-Forwarded-Proto "https" HTTPS=on
