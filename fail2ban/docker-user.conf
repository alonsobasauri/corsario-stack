# action.d/docker-user.conf
# Banea en la cadena DOCKER-USER, que Docker respeta ANTES de sus propias
# reglas de FORWARD para trafico publicado con -p. Banear solo en INPUT no
# sirve para puertos publicados por contenedores: ese trafico se enruta por
# FORWARD, no por INPUT.
# iptables-legacy a proposito: el anfitrion (MicroOS+Docker) usa el backend
# legacy de xtables, y este contenedor (Alpine) trae nft por defecto -- dos
# tablas de kernel distintas que no se ven entre si. Con el binario normal
# "iptables" la regla se crea "bien" pero en la tabla equivocada: no banea
# nada. Comprobado en vivo (t6690178b, 2026-09-03).
[Definition]
actionstart = iptables-legacy -N f2b-<name> 2>/dev/null || true
              iptables-legacy -F f2b-<name>
              iptables-legacy -I DOCKER-USER -j f2b-<name>
              iptables-legacy -A f2b-<name> -j RETURN

actionstop = iptables-legacy -D DOCKER-USER -j f2b-<name>
             iptables-legacy -F f2b-<name>
             iptables-legacy -X f2b-<name>

actioncheck = iptables-legacy -n -L DOCKER-USER | grep -q f2b-<name>

actionban = iptables-legacy -I f2b-<name> 1 -s <ip> -j DROP

actionunban = iptables-legacy -D f2b-<name> -s <ip> -j DROP

[Init]
name = default
port = 22
protocol = tcp
